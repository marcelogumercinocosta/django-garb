name: tests

on:
  push:
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.10", django: "5.1"}
          - {python: "3.10", django: "5.2"}
          - {python: "3.11", django: "5.1"}
          - {python: "3.11", django: "5.2"}
          - {python: "3.12", django: "5.1"}
          - {python: "3.12", django: "5.2"}
          - {python: "3.12", django: "6.0"}
          - {python: "3.13", django: "5.2"}
          - {python: "3.13", django: "5.1"}
          - {python: "3.13", django: "6.0"}
          - {python: "3.14", django: "5.2"}
          - {python: "3.14", django: "6.0"}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "." "Django~=${{ matrix.django }}.0"
      - run: python -W error::DeprecationWarning -m django check --settings=garb.tests.settings
      - run: python -W error::DeprecationWarning manage.py test garb.tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
