[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-garb"
version = "2026.8.0"
description = "Modern theme for the Django administration interface."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Marcelo Gumercino Costa", email = "marcelogc@gmail.com"},
]
dependencies = [
  "Django>=5.1,<6.1",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Documentation = "https://django-garb.readthedocs.io/en/latest/"
Repository = "https://github.com/marcelogumercinocosta/django-garb"

[tool.setuptools.packages.find]
include = ["garb*"]

[tool.setuptools.package-data]
garb = [
  "locale/**/*.po",
  "locale/**/*.mo",
  "static/**/*",
  "templates/**/*.html",
]
