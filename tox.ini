[tox]
env_list =
    py{310,311,312,313}-django51
    py{310,311,312,313,314}-django52
    py{312,313,314}-django60
skip_missing_interpreters = true

[testenv]
package = editable
deps =
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
commands =
    python -W error::DeprecationWarning -m django check --settings=garb.tests.settings
    python -W error::DeprecationWarning manage.py test garb.tests

